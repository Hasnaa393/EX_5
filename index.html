<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex5</title>
   
        <link rel="stylesheet" href="css/all.min.css">
        <link rel="stylesheet" href="css/fonts.css">
        <link rel="stylesheet" href="css/global.css">
        <link rel="stylesheet" href="css/bootstrap.css">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/style.responsive.css">
</head>
<body>

  <section id="Register" class="py-4">
    <div class="container">
        <div class="head mb-5 pt-4 text-center">
            <img src="images/logo-be01d065.png" alt="Logo_image">
        </div>
        <div class="body">
            <form action="" class=" m-auto p-4 rounded-4" data-type="add">

            <h3 class="mb-4 text-center">Students System</h3>
                    <i class="fa-solid fa-rotate-left"></i>

                   
                <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                        <input type="text" class="form-control" name="firstName" placeholder="First Name *" aria-label="First Name *" onblur="checkInput(this)" data-valid="false" required>        
                    </div>
                     <p class="alert alert-danger d-none" data-error-name="firstName" role="alert">
                                    
                            </p> 

                   
                <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                        <input type="text" class="form-control" name="lastName" placeholder="Last Name *" aria-label="Last Name *" onblur="checkInput(this)" data-valid="false" required>
                    </div>
                     <p class="alert alert-danger d-none" data-error-name="lastName" role="alert">
                        
                        </p>

                    
                <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" class="form-control" name="email"  placeholder="Email *" aria-label="Email *" onblur="checkInput(this)" data-valid="false" required>        
                    </div>
                     <p class="alert alert-danger d-none" data-error-name="email" role="alert">
                            
                            </p> 

                <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fa-solid fa-hashtag"></i></span>
                        <input type="text"  class="form-control" name="age" placeholder="Age *" aria-label="Age *" onblur="checkInput(this)" data-valid="false" required>        
                    </div>
                     <p class="alert alert-danger d-none" data-error-name="age" role="alert">
                          
                        </p>   

                    
                <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fa-solid fa-mobile"></i></span>
                        <input type="text" class="form-control" name="phone" placeholder="Phone *" aria-label="Phone *" onblur="checkInput(this)" data-valid="false" required>    
                    </div>
               <p class="alert alert-danger d-none" data-error-name="phone" role="alert">
                         
                        </p>

                    <button class="btn btn-success w-100">Add</button>
            </form>
        </div>
    </div>
    </section>

  <section id="Search">
            <form action="" class=" m-auto p-4 rounded-4">
                <div class="input-group mb-3">
                    <span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span>
                    <input type="text" class="form-control" id="searchInput" name="search" placeholder="Search...">
                </div>
            </form>
     </section>     
   
         
  <section id="Data" class="mb-5">
       <div class="container">
         <div class="table-responsive">
            <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>#</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Email</th>
                            <th>Age</th>
                            <th>Phone</th>
                            <th>Option</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td id="TableAlert" class="table-warning text-center" colspan="7">
                                       There are no data
                            </td>
                        </tr>
                    </tbody>
                </table>
        </div>
       </div>
    </section>

    
     <script src="js/bootstrap.js"></script>
     <script src="js/function.js"></script>
     <script src="js/main.js"></script>
</body>
</html>
